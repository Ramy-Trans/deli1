# ─── Sea Gull Restaurant — Customer Website ───────────────────────────────────
# Netlify site settings:
#   Base directory  →  artifacts/website
#   (Build command and publish dir are read from this file)
# ──────────────────────────────────────────────────────────────────────────────

[build]
  # Go up to the monorepo root, install all workspace deps, then build this app.
  command = "cd ../../ && pnpm install --frozen-lockfile && pnpm --filter @workspace/website run build"
  # publish is relative to the base directory (artifacts/website)
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH = "/"

# ── API proxy ─────────────────────────────────────────────────────────────────
# After you deploy your API server (Railway / Render / Fly.io / etc.),
# replace YOUR_API_SERVER_URL with its public URL, e.g. https://api.seagull.app
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_API_SERVER_URL/api/:splat"
  status = 200
  force = true

# ── SPA catch-all ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
