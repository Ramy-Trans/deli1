# ─── Sea Gull Restaurant — Admin Dashboard ────────────────────────────────────
# Netlify site → Build & Deploy → Build settings:
#   Base directory  →  artifacts/admin
#   Build command   →  (leave blank — read from this file)
#   Publish dir     →  (leave blank — read from this file)
# ──────────────────────────────────────────────────────────────────────────────

[build]
  command = "cd ../../ && pnpm install --frozen-lockfile && pnpm --filter @workspace/admin run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  PORT         = "3000"
  BASE_PATH    = "/"

# ── API proxy ─────────────────────────────────────────────────────────────────
# Replace YOUR_API_SERVER_URL with your live API server URL before deploying.
[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR_API_SERVER_URL/api/:splat"
  status = 200
  force  = true

# ── SPA catch-all ─────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
