[build]
  base = "../../"
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/admin run build"
  publish = "artifacts/admin/dist/public"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH = "/"

# Proxy /api/* requests to your deployed API server.
# Replace the `to` URL with your actual API server URL (e.g. Railway, Render, Fly.io).
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_API_SERVER_URL/api/:splat"
  status = 200
  force = true

# SPA catch-all: serve index.html for all client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "production"
