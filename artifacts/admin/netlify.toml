[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/admin run build"
  publish = "artifacts/admin/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PORT         = "3000"
  BASE_PATH    = "/"
  # Set VITE_API_URL in Netlify dashboard → Site config → Environment variables
  # Example: https://your-api-server.replit.app

[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR_API_SERVER_URL/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
